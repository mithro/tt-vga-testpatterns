# Tiny Tapeout project information
project:
  title:        "VGA Calibration: Modes"
  author:       "mithro"
  discord:      ""
  description:  "Colour bars in 640x480@60, 800x600@60 or 720x400@70 with selectable sync polarities"
  language:     "Verilog"
  clock_hz:     25175000

  tiles: "1x1"

  top_module:  "tt_um_vgacal_modes"

  source_files:
    - "project.v"
    - "hvsync_generator_mux.v"

pinout:
  # Inputs
  ui[0]: "Mode select bit 0"
  ui[1]: "Mode select bit 1"
  ui[2]: "Invert HSync polarity"
  ui[3]: "Invert VSync polarity"
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "R1"
  uo[1]: "G1"
  uo[2]: "B1"
  uo[3]: "VSync"
  uo[4]: "R0"
  uo[5]: "G0"
  uo[6]: "B0"
  uo[7]: "HSync"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
