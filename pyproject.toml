# SPDX-License-Identifier: Apache-2.0
[project]
name = "tt-vga-testpatterns"
version = "0.1.0"
description = "Calibration designs for checking a Tiny VGA capture pipeline end to end."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pillow",
    "cocotb>=2.0",
    "pytest",
]

[project.scripts]
ttp-check = "tools.check:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tools"]
